<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Youtube</title>
    <style>
        p {
            font-family: Roboto, Arial;
            margin-top: 0;
            margin-bottom: 0;
        }

        .thumbnail {
            width: 300px;
            display: block;
        }

        .search-bar {
            font-size: 20px;
            display: block;
        }

        .video-title {
            margin-top: 0;
            font-size: 14px;
            font-weight: bold;
            line-height: 20px;
            margin-bottom: 12px;
        }

        .video-preview {
            width: 300px;
            display: inline-block;
            vertical-align: top;
            margin-right: 15px;
        }

        .channel-pic {
            display: inline-block;
            width: 50px;
            vertical-align: top;
        }

        .video-info {
            display: inline-block;
            width: 200px;
        }

        .profile-pic {
            width: 40px;
            border-radius: 50px;
        }

        .thumbnail-row {
            margin-bottom: 12px;
        }

        .video-author {
            font-size: 12px;
            color: rgb(96, 96, 96);
            margin-bottom: 4px;
        }

        .video-stats {
            font-size: 12px;
            color: rgb(96, 96, 96);
        }
    </style>
</head>

<body>
    <input class="search-bar" type="text" placeholder="Search">
    <div class="video-preview">
        <div class="thumbnail-row">
            <img class="thumbnail" src="images/messi.webp">
        </div>
        <div>
            <div class="channel-pic">
                <img class="profile-pic" src="images/chan.png">
            </div>
            <div class="video-info">
                <p class="video-title">
                    Lionell Messi is the greatest footballer the world has ever witnessed
                </p>

                <p class="video-author">
                    Hamilton Migwambo
                </p>

                <P class="video-stats">
                    8.2B Views &#183; 4 weeks ago
                </P>
            </div>
        </div>
    </div>

    <div class="video-preview">
        <div class="thumbnail-row">
            <img class="thumbnail" src="images/messi.webp">
        </div>
        <div>
            <div class="channel-pic">
                <img class="profile-pic" src="images/chan.png">
            </div>
            <div class="video-info">
                <p class="video-title">
                    Lionell Messi against England in the Semis
                </p>

                <p class="video-author">
                    Migwambo Juniour
                </p>

                <P class="video-stats">
                    10.2B Views &#183; 4 weeks ago
                </P>
            </div>
        </div>
    </div>
</body>

</html>
